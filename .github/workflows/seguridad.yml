name: Seguridad (SAST / SCA / Secretos / IaC)

# Pipeline estándar de análisis de seguridad — ADBC / Coordinación de Gobierno Digital
# Fase 1: Semgrep (SAST) + Trivy y OSV-Scanner (SCA) + Gitleaks y TruffleHog (secretos) + Checkov (IaC).
# Resultados -> artefactos + resumen del job + (opcional) DefectDojo. El "gate" bloquea si hay HIGH/CRITICAL.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  pull-requests: write      # para comentar el resumen en el PR
  security-events: write    # solo se usa si activan la subida SARIF (requiere GitHub Code Security en repos privados)

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisis:
    name: analisis            # <-- este es el nombre del "status check" para la branch protection
    runs-on: [self-hosted, macOS]  
    timeout-minutes: 30
    env:
      # Umbral del gate: INFO | LOW | MEDIUM | HIGH | CRITICAL  (falla si hay algo >= al umbral)
      GATE_SEVERITY: ${{ vars.GATE_SEVERITY || 'HIGH' }}

    steps:
      - name: Checkout (historial completo para secretos)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # TruffleHog/Gitleaks revisan todo el historial

      - name: Preparar carpeta de reportes
        run: mkdir -p reports

      - name: Instalar herramientas (macOS self-hosted)
        run: |
          set -e
          # Homebrew solo para los binarios (Go), que sí instalan bien
          if [ -x /opt/homebrew/bin/brew ]; then BREW=/opt/homebrew/bin/brew
          elif [ -x /usr/local/bin/brew ]; then BREW=/usr/local/bin/brew
          else echo "Homebrew no está instalado"; exit 1; fi
          eval "$($BREW shellenv)"
          echo "$(dirname "$BREW")" >> "$GITHUB_PATH"
          brew install trivy gitleaks osv-scanner trufflehog

          # Semgrep y Checkov en un venv con el Python del SISTEMA
          # (evita el Python roto de Homebrew; pip baja wheels, no compila)
          /usr/bin/python3 -m venv "$HOME/.sec-tools"
          "$HOME/.sec-tools/bin/pip" install --upgrade pip
          "$HOME/.sec-tools/bin/pip" install semgrep checkov
          echo "$HOME/.sec-tools/bin" >> "$GITHUB_PATH"

          # Verificación
          trivy --version && gitleaks version && osv-scanner --version && trufflehog --version
          "$HOME/.sec-tools/bin/semgrep" --version
          "$HOME/.sec-tools/bin/checkov" --version
      # ---------------- SAST ----------------
      - name: Semgrep (SAST)
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan \
            --config p/default --config p/secrets --config p/owasp-top-ten \
            --metrics=off --error=false --no-git-ignore \
            --json --output reports/semgrep.json .

      # ---------------- SCA ----------------
      - name: Trivy (dependencias, secretos, IaC, licencias)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln,secret,misconfig,license \
            --format json --output reports/trivy.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL .

      - name: OSV-Scanner (segunda opinión de dependencias)
        continue-on-error: true
        run: |
          osv-scanner scan --recursive --format json --output reports/osv.json . || true

      # ---------------- Secretos ----------------
      - name: Gitleaks (secretos en el historial)
        continue-on-error: true
        run: |
          gitleaks detect --source . --report-format json --report-path reports/gitleaks.json --redact || true

      - name: TruffleHog (secretos verificados)
        continue-on-error: true
        run: |
          trufflehog filesystem . --json --no-update > reports/trufflehog.json || true

      # ---------------- IaC ----------------
      - name: Checkov (IaC / configuración)
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          checkov -d . --output json --compact --quiet > reports/checkov.json || true

      # ---------------- Publicar a DefectDojo (opcional) ----------------
      - name: Importar a DefectDojo
        if: ${{ env.DEFECTDOJO_URL != '' }}
        continue-on-error: true
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          PRODUCT_NAME: ${{ github.repository }}
          ENGAGEMENT_NAME: CI-${{ github.ref_name }}
        run: bash scripts/defectdojo-import.sh

      # ---------------- Subir reportes como artefacto ----------------
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-seguridad
          path: reports/
          retention-days: 30

      # ---------------- (Opcional) GitHub Code Scanning ----------------
      # Descomentar SOLO si tienen GitHub Code Security (en repos privados es de pago).
      # Requiere que Semgrep/Trivy emitan SARIF (ver nota en el README).
      # - name: Subir SARIF a Code Scanning
      #   if: ${{ vars.ENABLE_CODE_SCANNING == 'true' }}
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: reports/semgrep.sarif

      # ---------------- Gate: decide aprobar o bloquear ----------------
      - name: Resumen y gate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 scripts/gate.py --reports-dir reports --threshold "$GATE_SEVERITY" --summary "$GITHUB_STEP_SUMMARY"
